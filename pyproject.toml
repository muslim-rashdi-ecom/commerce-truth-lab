[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-truth-lab"
version = "0.1.0"
description = "Evidence-first order, cash and conversion-signal auditing with offline fault replay"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Syed Muslim Shah"}]
dependencies = []

[project.scripts]
commerce-truth = "commerce_truth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
